[package]
name = "hodlhub"
version = "0.1.0"
description = "hodlhub main program"
edition = "2021"
license = "BUSL-1.1"

[lib]
doctest = false
crate-type = ["cdylib", "lib"]
name = "hodlhub"

[features]
default = ["devnet"]
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.0", features = ["metadata"] }
anchor-safe-math = "0.5.0"
rust_decimal = { version = "1.35.0", features = ["maths"] }
rust_decimal_macros = "1.34.2"
borsh = "1.5.0"
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
raydium-cp-swap = { git = " https://github.com/Apocentre//raydium-cp-swap", branch = "chore/anchor_0.30", features = ["no-entrypoint", "cpi"] }
